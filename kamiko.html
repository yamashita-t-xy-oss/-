<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>できた！ノート</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #f0f4f8;
    }

    /* 画面切り替え（初期状態は非表示） */
    .screen {
      display: none;
    }

    /* activeクラスが付いている画面だけ表示 */
    .screen.active {
      display: block;
    }

    h1 {
      font-size: 2.2rem;
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .btn-back {
      font-size: 1.2rem;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      background: #cbd5e1;
      color: #1e293b;
      font-weight: bold;
      cursor: pointer;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .btn-card {
      font-size: 2rem;
      font-weight: bold;
      padding: 35px 20px;
      border: none;
      border-radius: 20px;
      background: white;
      color: #334155;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.1s, background-color 0.1s;
    }

    .btn-card:active {
      transform: scale(0.96);
      background-color: #e2e8f0;
    }

    /* できた！ボタン画面 */
    .work-box {
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
    }

    .work-info {
      font-size: 1.8rem;
      margin-bottom: 25px;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    .work-info p {
      margin: 8px 0;
    }

    .btn-dekita {
      width: 100%;
      height: 300px;
      font-size: 4rem;
      font-weight: bold;
      color: white;
      background: #ff9800;
      border: none;
      border-radius: 30px;
      box-shadow: 0 12px 24px rgba(255, 152, 0, 0.4);
      cursor: pointer;
      transition: transform 0.1s, background-color 0.1s;
    }

    .btn-dekita:active {
      transform: scale(0.94);
      background: #e68a00;
    }

    .btn-dekita:disabled {
      background: #ccc;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <!-- 1. 生徒選択画面 -->
  <section id="screen-student" class="screen active">
    <h1>🌱 なまえを えらんでね</h1>
    <div id="student-list" class="grid-container">
      <p style="font-size: 1.5rem; text-align: center; grid-column: span 2;">データを よみこんでいます...</p>
    </div>
  </section>

  <!-- 2. メインメニュー画面 -->
  <section id="screen-menu" class="screen">
    <header class="header">
      <button class="btn-back" onclick="showScreen('screen-student')">⬅ えらびなおす</button>
      <h2 id="current-student-name">〇〇 さんのメニュー</h2>
    </header>
    <div class="grid-container menu-grid">
      <button class="btn-card morning" onclick="showScreen('screen-morning')">☀️<br>あさの きぶん</button>
      <button class="btn-card work" onclick="showScreen('screen-work')">🌟<br>さぎょう（できた！）</button>
      <button class="btn-card rest" onclick="showScreen('screen-rest')">☕<br>きゅうけい・そうだん</button>
      <button class="btn-card evening" onclick="showScreen('screen-evening')">🏠<br>かえりの ふりかえり</button>
    </div>
  </section>

  <!-- 3. 朝の気分画面 -->
  <section id="screen-morning" class="screen">
    <header class="header">
      <button class="btn-back" onclick="showScreen('screen-menu')">⬅ もどる</button>
      <h2>☀️ あさの きぶん</h2>
    </header>
    <div class="grid-container">
      <button class="btn-card" onclick="sendMorning('😀 元気')">😀 元気</button>
      <button class="btn-card" onclick="sendMorning('🙂 ふつう')">🙂 ふつう</button>
      <button class="btn-card" onclick="sendMorning('😔 つかれた')">😔 つかれた</button>
      <button class="btn-card" onclick="sendMorning('😣 しんどい')">😣 しんどい</button>
    </div>
  </section>

  <!-- 4. 作業（できた！）画面 -->
  <section id="screen-work" class="screen">
    <header class="header">
      <button class="btn-back" onclick="showScreen('screen-menu')">⬅ もどる</button>
      <h2>🌟 さぎょうの きろく</h2>
    </header>
    <div class="work-box">
      <div class="work-info">
        <p>さぎょう: <strong id="work-task-name">-</strong></p>
        <p>きじゅん: <strong id="work-unit-value">-</strong></p>
      </div>
      <button id="btn-dekita" class="btn-dekita" onclick="sendWork()">
        🌟 できた！
      </button>
    </div>
  </section>

  <!-- 5. 帰りの振り返り画面 -->
  <section id="screen-evening" class="screen">
    <header class="header">
      <button class="btn-back" onclick="showScreen('screen-menu')">⬅ もどる</button>
      <h2>🏠 かえりの ふりかえり</h2>
    </header>
    <div class="grid-container">
      <button class="btn-card" onclick="sendEvening('😀 楽しかった', 'がんばった！')">😀 たのしかった！</button>
      <button class="btn-card" onclick="sendEvening('🙂 がんばれた', 'よくできた！')">🙂 がんばれた！</button>
      <button class="btn-card" onclick="sendEvening('😐 ふつう', 'いつもどおり')">😐 ふつう</button>
      <button class="btn-card" onclick="sendEvening('😔 つかれた', 'つかれた')">😔 つかれた</button>
    </div>
  </section>

  <!-- 6. 休憩・相談画面 -->
  <section id="screen-rest" class="screen">
    <header class="header">
      <button class="btn-back" onclick="showScreen('screen-menu')">⬅ もどる</button>
      <h2>☕ きゅうけい・そうだん</h2>
    </header>
    <div class="grid-container">
      <button class="btn-card" onclick="alert('せんせいに おしえたよ'); showScreen('screen-menu');">🚻 トイレ</button>
      <button class="btn-card" onclick="alert('せんせいに おしえたよ'); showScreen('screen-menu');">💧 おみず</button>
      <button class="btn-card" onclick="alert('せんせいに おしえたよ'); showScreen('screen-menu');">🪑 やすむ</button>
      <button class="btn-card" onclick="alert('せんせいに おしえたよ'); showScreen('screen-menu');">🆘 せんせい</button>
    </div>
  </section>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzU-5MIBEtMkiOBXmWeNtBHzz83CdzJnVegSj35SInKMEKVrgvJATwa38AGaOUlaiWdyQ/exec";

    let students = [];
    let currentStudent = null;

    // アプリ起動時：スプレッドシートから生徒マスターを取得
    window.onload = async () => {
      try {
        const res = await fetch(GAS_API_URL);
        students = await res.json();
        renderStudentList();
      } catch (err) {
        alert("生徒データのよみこみに しっぱいしました");
      }
    };

    // 生徒ボタン一覧の描画
    function renderStudentList() {
      const container = document.getElementById("student-list");
      container.innerHTML = "";
      
      if (!students || students.length === 0) {
        container.innerHTML = "<p style='grid-column: span 2;'>生徒データが見つかりません</p>";
        return;
      }
      
      students.forEach(student => {
        const btn = document.createElement("button");
        btn.className = "btn-card";
        btn.innerText = student.name;
        btn.onclick = () => selectStudent(student);
        container.appendChild(btn);
      });
    }

    // 生徒選択
    function selectStudent(student) {
      currentStudent = student;
      document.getElementById("current-student-name").innerText = `${student.name} さんのメニュー`;
      document.getElementById("work-task-name").innerText = student.task;
      document.getElementById("work-unit-value").innerText = `${student.value} ${student.unit}`;
      showScreen("screen-menu");
    }

    // 画面切り替え
    function showScreen(screenId) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(screenId).classList.add("active");
    }

    // データ送信共通処理 (GASへPOST)
    async function sendToGAS(payload) {
      await fetch(GAS_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    }

    // 朝の気分送信
    async function sendMorning(mood) {
      const now = new Date();
      await sendToGAS({
        type: "morning",
        studentName: currentStudent.name,
        mood: mood,
        date: now.toLocaleDateString('ja-JP'),
        time: now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
      });
      alert("あさの きぶんを きろくしたよ！");
      showScreen("screen-menu");
    }

    // 作業「できた！」送信
    async function sendWork() {
      const btn = document.getElementById("btn-dekita");
      btn.disabled = true; // 連打防止

      const now = new Date();
      await sendToGAS({
        type: "work",
        studentName: currentStudent.name,
        task: currentStudent.task,
        value: currentStudent.value,
        unit: currentStudent.unit,
        timestamp: `${now.toLocaleDateString('ja-JP')} ${now.toLocaleTimeString('ja-JP')}`
      });

      alert("🌟 できた！ すごいね！");
      btn.disabled = false;
    }

    // 帰りの振り返り送信
    async function sendEvening(mood, comment) {
      const now = new Date();
      await sendToGAS({
        type: "evening",
        studentName: currentStudent.name,
        mood: mood,
        comment: comment,
        date: now.toLocaleDateString('ja-JP')
      });
      alert("きょうも 1にち おつかれさまでした！");
      showScreen("screen-student"); // 生徒選択へ戻る
    }
  </script>
</body>
</html>
