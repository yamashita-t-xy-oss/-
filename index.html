<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>できた！ノート（紙工班）</title>
  <style>
    :root {
      --primary-color: #4CAF50;
      --primary-hover: #45a049;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #FF9800;
      --danger-color: #f44336;
      --info-color: #2196F3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding: 10px;
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 1.8rem;
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 15px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 15px;
    }

    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
      font-size: 1.2rem;
      font-weight: bold;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background-color: #fafafa;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 100px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-student {
      background-color: #e8f5e9;
      border-color: #a5d6a7;
      color: #2e7d32;
      font-size: 1.4rem;
    }

    .btn-mood {
      font-size: 1.1rem;
    }

    .btn-mood span.icon {
      font-size: 2.5rem;
      margin-bottom: 5px;
    }

    .btn-task {
      background-color: #e3f2fd;
      border-color: #90caf9;
      color: #1565c0;
    }

    .btn-action {
      background-color: var(--primary-color);
      color: white;
      border: none;
      font-size: 1.3rem;
      padding: 15px;
      width: 100%;
      margin-top: 15px;
    }

    .btn-back {
      background-color: #757575;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 8px;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .btn-help {
      background-color: #fff3e0;
      border-color: #ffe0b2;
      color: #e65100;
      font-size: 1.2rem;
    }

    .btn-help span.icon {
      font-size: 2rem;
      margin-bottom: 5px;
    }

    .number-input {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }

    .btn-num {
      width: 50px;
      height: 50px;
      font-size: 1.8rem;
      border-radius: 50%;
      border: none;
      background-color: var(--primary-color);
      color: white;
      cursor: pointer;
    }

    .num-display {
      font-size: 2.5rem;
      font-weight: bold;
      min-width: 60px;
      text-align: center;
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #f0f4f8;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* 通知トースト */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 1.1rem;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <h1>できた！ノート（紙工班）</h1>
  </header>

  <div id="toast">記録しました！</div>

  <!-- 1. 生徒選択画面 -->
  <div id="sec-students" class="container">
    <h2>なまえを えらんでね</h2>
    <div class="grid-2">
      <button class="btn btn-student" onclick="selectStudent('生徒A')">生徒A</button>
      <button class="btn btn-student" onclick="selectStudent('生徒B')">生徒B</button>
      <button class="btn btn-student" onclick="selectStudent('生徒C')">生徒C</button>
      <button class="btn btn-student" onclick="selectStudent('生徒D')">生徒D</button>
    </div>
  </div>

  <!-- 2. メインメニュー画面 -->
  <div id="sec-menu" class="container hidden">
    <div class="user-bar">
      <span id="current-student-display"></span>
      <button class="btn-back" onclick="showSection('sec-students')">かえる</button>
    </div>

    <h2>きょうの こうどう</h2>
    <div class="grid-2">
      <button class="btn btn-task" onclick="showSection('sec-morning')">
        <span style="font-size: 2rem;">☀️</span>
        あさの きぶん
      </button>
      <button class="btn btn-task" onclick="showSection('sec-work')" style="background-color: #e8f5e9; border-color: #a5d6a7; color: #2e7d32;">
        <span style="font-size: 2rem;">✂️</span>
        さぎょうの きろく
      </button>
      <button class="btn btn-task" onclick="showSection('sec-evening')" style="background-color: #fff3e0; border-color: #ffe0b2; color: #e65100;">
        <span style="font-size: 2rem;">🌆</span>
        かえりの ふりかえり
      </button>
    </div>

    <h3 style="margin-top: 25px; margin-bottom: 10px;">きゅうけい・そうだん</h3>
    <div class="grid-2">
      <button class="btn btn-help" onclick="handleHelp('きゅうけい')">
        <span class="icon">☕</span>
        きゅうけい する
      </button>
      <button class="btn btn-help" onclick="handleHelp('そうだん')">
        <span class="icon">🙋‍♂️</span>
        そうだん する
      </button>
    </div>
  </div>

  <!-- 3. 朝の気分画面 -->
  <div id="sec-morning" class="container hidden">
    <button class="btn-back" onclick="showSection('sec-menu')">← もどる</button>
    <h2>あさの きぶんは？</h2>
    <div class="grid-3">
      <button class="btn btn-mood" onclick="saveMorning('元気')">
        <span class="icon">😄</span>げんき
      </button>
      <button class="btn btn-mood" onclick="saveMorning('ふつう')">
        <span class="icon">🙂</span>ふつう
      </button>
      <button class="btn btn-mood" onclick="saveMorning('つかれた')">
        <span class="icon">😮‍💨</span>つかれた
      </button>
    </div>
  </div>

  <!-- 4. 作業ログ画面 -->
  <div id="sec-work" class="container hidden">
    <button class="btn-back" onclick="showSection('sec-menu')">← もどる</button>
    <h2>なにが できた？</h2>
    
    <div class="grid-2">
      <button class="btn btn-task" onclick="selectTask('紙ちぎり')">📄 紙ちぎり</button>
      <button class="btn btn-task" onclick="selectTask('紙すき')">🌊 紙すき</button>
      <button class="btn btn-task" onclick="selectTask('圧搾')">💪 圧搾</button>
      <button class="btn btn-task" onclick="selectTask('干し')">☀️ 干し</button>
    </div>

    <div id="count-area" class="hidden" style="margin-top: 20px; text-align: center;">
      <h3 id="selected-task-display"></h3>
      <div class="number-input">
        <button class="btn-num" onclick="changeCount(-1)">-</button>
        <span id="num-display" class="num-display">1</span>
        <button class="btn-num" onclick="changeCount(1)">+</button>
      </div>
      <button class="btn btn-action" onclick="saveWork()">できた！を きろく</button>
    </div>
  </div>

  <!-- 5. 帰りの振り返り画面 -->
  <div id="sec-evening" class="container hidden">
    <button class="btn-back" onclick="showSection('sec-menu')">← もどる</button>
    <h2>きょうの ふりかえり</h2>
    <div class="grid-3">
      <button class="btn btn-mood" onclick="saveEvening('たのしかった')">
        <span class="icon">😆</span>たのしかった
      </button>
      <button class="btn btn-mood" onclick="saveEvening('がんばった')">
        <span class="icon">😤</span>がんばった
      </button>
      <button class="btn btn-mood" onclick="saveEvening('まあまあ')">
        <span class="icon">🙂</span>まあまあ
      </button>
    </div>
  </div>

  <script>
    // ⚠️ ご自身のGAS（Google Apps Script）のウェブアプリURLをここに設定してください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzz69-m6p7f2jX2mThmXmQpB101N45-s2Xm24o1d/exec";

    let currentStudent = "";
    let selectedTaskName = "";
    let currentCount = 1;

    // --- 音声読み上げ機能 ---
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // 前の音声を止める
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.0;  // 速度
        uttr.pitch = 1.2; // 少し高めの声で聞き取りやすく
        window.speechSynthesis.speak(uttr);
      }
    }

    // 画面切り替え
    function showSection(sectionId) {
      const sections = ['sec-students', 'sec-menu', 'sec-morning', 'sec-work', 'sec-evening'];
      sections.forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(sectionId).classList.remove('hidden');
    }

    // 生徒選択
    function selectStudent(name) {
      currentStudent = name;
      document.getElementById('current-student-display').textContent = "👤 " + name;
      showSection('sec-menu');
    }

    // 休憩・相談ボタン処理（「せんせい」と喋る機能を追加）
    function handleHelp(type) {
      // 1. 「せんせい」と音声を発する
      speakText('せんせい');

      // 2. トースト通知
      showToast(`${type} を つたえました`);

      // 3. GAS送信（任意記録）
      sendData({
        type: 'help',
        student: currentStudent,
        detail: type
      });
    }

    // 朝の気分保存
    function saveMorning(mood) {
      showToast(`あさのきぶん：「${mood}」をきろくしました`);
      sendData({
        type: 'morning',
        student: currentStudent,
        mood: mood
      });
      showSection('sec-menu');
    }

    // 作業選択
    function selectTask(taskName) {
      selectedTaskName = taskName;
      currentCount = 1;
      document.getElementById('selected-task-display').textContent = taskName + " の かず";
      document.getElementById('num-display').textContent = currentCount;
      document.getElementById('count-area').classList.remove('hidden');
    }

    // 数量変更
    function changeCount(delta) {
      currentCount = Math.max(1, currentCount + delta);
      document.getElementById('num-display').textContent = currentCount;
    }

    // 作業ログ保存
    function saveWork() {
      showToast(`${selectedTaskName} ${currentCount}個 できた！`);
      sendData({
        type: 'work',
        student: currentStudent,
        task: selectedTaskName,
        count: currentCount
      });
      document.getElementById('count-area').classList.add('hidden');
      showSection('sec-menu');
    }

    // 帰りの振り返り保存
    function saveEvening(mood) {
      showToast(`ふりかえり：「${mood}」をきろくしました`);
      sendData({
        type: 'evening',
        student: currentStudent,
        mood: mood
      });
      showSection('sec-menu');
    }

    // GASデータ送信関数
    function sendData(data) {
      if (!GAS_URL || GAS_URL.includes("ここに")) {
        console.log("GAS URL未設定: ", data);
        return;
      }

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      })
      .then(() => console.log("送信成功"))
      .catch(err => console.error("送信エラー:", err));
    }

    // トースト表示
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }
  </script>
</body>
</html>
